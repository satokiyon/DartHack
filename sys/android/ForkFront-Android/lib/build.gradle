plugins {
  id 'com.android.library'
}

group = 'com.tbd.forkfront'
version = '2.0'
int versionId = 2000;

android {

  namespace = 'com.tbd.forkfront'
  compileSdk {
      version = release(36)
  }
  buildToolsVersion '36.0.0'

  defaultConfig {
    minSdkVersion 30
    targetSdkVersion 36
    versionName version
    versionCode versionId
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  afterEvaluate {
    tasks.withType(JavaCompile).configureEach {
      options.compilerArgs += ["-Xlint:deprecation"]
    }
  }

  lint {
    // TODO: this is needed because the indentation in the project is inconcsistent, but I should probably just normalize the indentation in the first place.
    disable = ['SuspiciousIndentation', 'ExpiredTargetSdkVersion']
  }

  sourceSets {
    main {
      manifest.srcFile('AndroidManifest.xml')
      java.srcDirs(['src'])
      res.srcDirs(['res'])
    }
  }
  buildTypes {
    debug {
      jniDebuggable true
    }
  }
    ndkVersion '30.0.14904198 rc1'
}

dependencies {
}
