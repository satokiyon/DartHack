plugins {
  id 'com.android.application'
}

android {

  namespace = "jp.satokiyon.NetHackJP"
  compileSdk = 36
  buildToolsVersion = "36.0.0"

  defaultConfig {
    minSdkVersion  30
    targetSdkVersion  36
    versionName = '5.0.0'
    versionCode = 5000
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  lintOptions {
    disable = ['MissingClass', 'ExpiredTargetSdkVersion']
  }

  sourceSets {
    main {
      manifest.srcFile('AndroidManifest.xml')
      res.srcDirs(['res'])
      assets.srcDirs(['assets'])
      jniLibs.srcDirs(['libs'])
    }
  }

  splits {
    abi {
        enable = true
        reset()
        include "x86", "x86_64", "armeabi", "arm64-v8a", "armeabi-v7a"
        universalApk = false
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig = signingConfigs.debug
    }
  }
}

dependencies {
    implementation project(':lib')
}
